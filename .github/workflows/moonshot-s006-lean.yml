name: Check adaptive Walsh repair against the pinned Lean sources
on:
  push:
    branches: [research/moonshot-overhead-program]
    paths:
      - 'research/moonshot-overhead-program/contributions/explicit-overhead/formal/RepairDyadic.lean'
      - 'research/moonshot-overhead-program/contributions/explicit-overhead/formal/check.sh'
      - '.github/workflows/moonshot-s006-lean.yml'
permissions:
  contents: read
concurrency:
  group: moonshot-s006-lean
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: research/moonshot-overhead-program/contributions/explicit-overhead/formal
      - name: Install the checksum-pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/moonshot-lean.tar.zst"
          curl --fail --location --retry 3 --silent --show-error https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst -o "$archive"
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          rm -- "$archive"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Build the original source modules and the repair theorem
        run: bash research/moonshot-overhead-program/contributions/explicit-overhead/formal/check.sh
